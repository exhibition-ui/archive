<style>
:root{
  --night:#1a0f2e; --view:#0d0818; --deep:#3b1054; --mid:#5c2d8e; --soft:#7b52a8;
  --tint:#f5f0fb; --border:#e0d0f0; --lilac:#c4a0e0; --gold:#C8A96E;
  --dim:rgba(245,240,251,.58);
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--tint)}
body{font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.stage{height:100vh;height:100svh;min-height:520px;display:flex;flex-direction:column}

/* White band: the participant pages' top nav (generate.py CSS), museum name centered */
.top{flex:none;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:1.5rem;padding:0.75rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);color:var(--deep);font-size:17px;line-height:1.7}
.top .eye{justify-self:start;display:block;width:28px;height:28px;flex-shrink:0}
.top .eye img{width:100%;height:100%;object-fit:contain;display:block}
.top a.eye{transition:opacity .2s}
.top a.eye:hover{opacity:.8}
.top .name{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.top .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:0.88rem;line-height:1.2;color:var(--deep)}
.top .la{font:400 10px/1 var(--sans);letter-spacing:.22em;padding-left:.22em;text-transform:uppercase;color:var(--gold);white-space:nowrap;margin-top:4px}
.top .museum{justify-self:end;font-size:0.82rem;font-weight:400;color:var(--deep);opacity:.7;transition:opacity .2s;white-space:nowrap}
.top .museum:hover{opacity:1}

/* The view */
.vw{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--view);cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.view:focus-visible{outline-offset:-3px}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform-origin:50% 50%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.view img.on{opacity:1}
.view.wide img.pt{object-fit:contain;object-position:50% 50% !important}   /* portrait views on a wide screen: whole, never a strip */

/* Night band, after the tour band */
.band{flex:none;position:relative;background:var(--night);padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.pulse{position:absolute;top:0;left:0;width:80%;height:1px;pointer-events:none}
.pulse i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--gold);opacity:0}
.meta{position:relative;display:flex;align-items:flex-start;justify-content:flex-end;gap:22px;margin-top:-4px}
.cap{flex:0 1 60ch;min-width:0;font-size:11.5px;line-height:1.45;color:var(--dim);opacity:.8;text-align:right;transition:opacity 1.2s}
.cap.out{opacity:0}
.cap a{color:var(--tint);text-decoration:underline;text-decoration-color:rgba(196,160,224,.45);text-underline-offset:2px}
.cap a:hover{color:#fff;text-decoration-color:var(--gold)}
.cap .cr{white-space:nowrap}   /* "Photo: Daniel R. Pratt" never breaks across lines */
.cap-probe{position:absolute;right:0;top:0;visibility:hidden;pointer-events:none;transition:none}
.pause{flex:none;font:400 12px/1.4 var(--sans);color:var(--lilac);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(196,160,224,.45);cursor:pointer}
.pause:hover{color:#fff}

.doors{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.door{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:inherit;background:none;border:0;padding:0;font:inherit;cursor:pointer}
span.door{cursor:default}
.thumb{width:64px;height:64px;border-radius:2px;overflow:hidden;background:var(--deep);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.door:hover .thumb img,.door:focus-visible .thumb img{transform:scale(1.06)}
.thumb.glyph{background:transparent;display:grid;place-items:center;color:var(--gold)}
.thumb.glyph svg{width:34px;height:34px;display:block;transition:transform .6s ease}
.door:hover .thumb.glyph svg{transform:scale(1.06)}
.dt{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.dt b{font:400 18px/1.1 var(--serif);color:#fff;position:relative}
.dt b::after{content:"";position:absolute;left:0;bottom:-5px;height:1px;width:0;background:var(--gold);transition:width .35s ease}
.door:hover .dt b::after,.door:focus-visible .dt b::after,.door[aria-current] .dt b::after,.door.cur .dt b::after{width:100%}
.dt small{font-size:12px;color:var(--lilac);opacity:.8}
.dt .arr{color:var(--gold);font-family:var(--sans);font-size:14px;margin-left:6px}
.doors.n4 .dt b{font-size:16px}
@media (max-width:759px){
  .doors.scroll{display:flex;overflow-x:auto;gap:20px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .doors.scroll::-webkit-scrollbar{display:none}
  .doors.scroll .door{flex:0 0 88px;scroll-snap-align:start}
}
@media (max-width:560px){
  .top{padding:0.6rem 1rem;gap:0.9rem}
  .top .nm{font-size:0.78rem}
  .top .museum{font-size:0.72rem}
}
@media (min-width:760px){
  .band{padding:12px 40px calc(22px + env(safe-area-inset-bottom,0px));gap:18px}
  .pulse{width:50%}
  .doors{display:flex;flex-wrap:wrap;justify-content:center;gap:14px clamp(28px,4.5vw,64px)}   /* 64px apart from 1422px up; closer on narrower screens so four doors fit */
  .door{flex-direction:row;text-align:left;gap:16px}
  .thumb{width:72px;height:72px}
  .thumb.glyph svg{width:38px;height:38px}
  .dt{align-items:flex-start}
  .dt b,.doors.n4 .dt b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  .cap{transition:opacity .3s}
  .thumb img,.thumb.glyph svg,.dt b::after{transition:none}
}

doors.forEach(function(d){ d.addEventListener('click',function(){ show(+d.getAttribute('data-slide'),true); }); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&playing){ awayPause=true; setPlaying(false); }
  else if(!document.hidden&&awayPause){ awayPause=false; setPlaying(true); }
});
if(!playing) btn.textContent='Play motion';
L[0].classList.remove('on'); L[0].style.opacity='0';
show(0,false);
})();
</script>
</body>
</html>
